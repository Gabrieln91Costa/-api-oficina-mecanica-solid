apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
        - name: api
          image: oficina-api:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: oficina-config
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: oficina-secret, key: DATABASE_URL}}
            - name: WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: oficina-secret, key: WEBHOOK_TOKEN}}
            - name: SMTP_USER
              valueFrom: {secretKeyRef: {name: oficina-secret, key: SMTP_USER, optional: true}}
            - name: SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: oficina-secret, key: SMTP_PASSWORD, optional: true}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
spec:
  type: NodePort
  selector:
    app: oficina-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
