
name: CI-CD Oficina

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. QUALIDADE E TESTES AUTOMATIZADOS
  # ==========================================
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes automatizados
        run: pytest -q --cov=oficina --cov-report=term-missing

  # ==========================================
  # 2. BUILD E PUBLICAÇÃO NO GHCR
  # ==========================================
  build-and-publish:
    needs: quality-and-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Definir nome da imagem
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          REPO="${REPO#-}"

          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

  # ==========================================
  # 3. DEPLOY NO KUBERNETES LOCAL
  # ==========================================
  deploy:
    needs: build-and-publish

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: [self-hosted, Windows, X64]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------
      # VALIDAR AMBIENTE
      # ----------------------------------------
      - name: Validar ambiente local
        shell: powershell
        run: |
          Write-Host "Validando Docker..."
          docker version

          if ($LASTEXITCODE -ne 0) {
            throw "Docker nao esta funcionando."
          }

          Write-Host "Validando Kind..."
          kind get clusters

          if ($LASTEXITCODE -ne 0) {
            throw "Kind nao esta funcionando."
          }

          Write-Host "Validando Kubernetes..."
          $context = kubectl config current-context

          if ($LASTEXITCODE -ne 0 -or $context -ne "kind-oficina-local") {
            throw "Contexto Kubernetes incorreto: $context"
          }

          kubectl get nodes

          if ($LASTEXITCODE -ne 0) {
            throw "Nao foi possivel acessar os nos Kubernetes."
          }

      # ----------------------------------------
      # BUILD LOCAL E CARGA NO KIND
      # ----------------------------------------
      - name: Build local e carregar imagem no Kind
        shell: powershell
        run: |
          $sha = "${{ github.sha }}"
          $image = "oficina-api:$sha"

          Write-Host "Construindo imagem: $image"

          docker build -t $image .

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao construir imagem Docker."
          }

          Write-Host "Carregando imagem no Kind..."

          kind load docker-image $image --name oficina-local

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao carregar imagem no Kind."
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "IMAGE_NAME=$image`n",
            $utf8NoBom
          )

      # ----------------------------------------
      # APLICAR CONFIGURACOES KUBERNETES
      # ----------------------------------------
      - name: Aplicar configurações Kubernetes
        shell: powershell
        run: |
          Write-Host "Aplicando namespace..."

          kubectl apply -f k8s/namespace.yaml

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar namespace."
          }

          Write-Host "Validando Secret..."

          kubectl get secret oficina-secret -n oficina

          if ($LASTEXITCODE -ne 0) {
            throw "Secret oficina-secret nao encontrado."
          }

          Write-Host "Aplicando PostgreSQL..."

          kubectl apply -f k8s/postgres.yaml

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar PostgreSQL."
          }

          kubectl rollout status statefulset/postgres -n oficina --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL nao ficou pronto."
          }

          Write-Host "Aplicando ConfigMap..."

          kubectl apply -f k8s/configmap.yaml

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar ConfigMap."
          }

          Write-Host "Aplicando Deployment..."

          kubectl apply -f k8s/deployment.yaml

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar Deployment."
          }

          Write-Host "Aplicando HPA..."

          kubectl apply -f k8s/hpa.yaml

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar HPA."
          }

      # ----------------------------------------
      # ATUALIZAR IMAGEM DA APLICACAO
      # ----------------------------------------
      - name: Atualizar aplicação
        shell: powershell
        run: |
          Write-Host "Atualizando imagem da API: $env:IMAGE_NAME"

          kubectl set image deployment/oficina-api api=$env:IMAGE_NAME -n oficina

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao atualizar imagem da API."
          }

          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Deploy da API nao foi concluido."
          }

      # ----------------------------------------
      # VALIDAR DEPLOY
      # ----------------------------------------
      - name: Validar deploy
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "PODS"
          Write-Host "================================"

          kubectl get pods -n oficina -o wide

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao consultar Pods."
          }

          Write-Host "================================"
          Write-Host "SERVICES"
          Write-Host "================================"

          kubectl get services -n oficina

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao consultar Services."
          }

          Write-Host "================================"
          Write-Host "HPA"
          Write-Host "================================"

          kubectl get hpa -n oficina

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao consultar HPA."
          }

          Write-Host "================================"
          Write-Host "HEALTH CHECK"
          Write-Host "================================"

          $response = Invoke-RestMethod http://localhost:8080/health

          $response | ConvertTo-Json

          Write-Host "Deploy concluido com sucesso!"
