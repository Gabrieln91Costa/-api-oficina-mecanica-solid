
name: CI-CD Oficina

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes automatizados
        run: pytest -q --cov=oficina --cov-report=term-missing

  build-and-publish:
    needs: quality-and-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          REPO="${REPO#-}"
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

  deploy:
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Validar ambiente local
        shell: powershell
        run: |
          Write-Host "Validando Docker..."
          docker version

          Write-Host "Validando Kind..."
          kind get clusters

          Write-Host "Validando Kubernetes..."
          kubectl config current-context
          kubectl get nodes

          if ((kubectl config current-context) -ne "kind-oficina-local") {
            throw "Contexto Kubernetes incorreto!"
          }

      - name: Login no GitHub Container Registry
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GH_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin

      - name: Baixar imagem publicada
        shell: powershell
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $repo = "${{ github.event.repository.name }}".ToLower()

          if ($repo.StartsWith("-")) {
            $repo = $repo.Substring(1)
          }

          $image = "ghcr.io/$owner/$repo:${{ github.sha }}"

          Write-Host "Baixando imagem: $image"
          docker pull $image

          "IMAGE_NAME=$image" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Carregar imagem no Kind
        shell: powershell
        run: |
          kind load docker-image $env:IMAGE_NAME --name oficina-local

      - name: Aplicar configurações Kubernetes
        shell: powershell
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Atualizar aplicação
        shell: powershell
        run: |
          kubectl set image deployment/oficina-api api=$env:IMAGE_NAME -n oficina
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

      - name: Validar deploy
        shell: powershell
        run: |
          kubectl get pods -n oficina -o wide
          kubectl get services -n oficina
          Invoke-RestMethod http://localhost:8080/health
