
name: CI-CD Oficina

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes automatizados
        run: pytest -q --cov=oficina --cov-report=term-missing

  build-and-publish:
    needs: quality-and-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Definir nome da imagem
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          REPO="${REPO#-}"
          echo "image=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

  deploy:
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Validar ambiente local
        shell: powershell
        run: |
          Write-Host "Validando Docker..."
          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker nao esta funcionando."
          }

          Write-Host "Validando Kind..."
          kind get clusters
          if ($LASTEXITCODE -ne 0) {
            throw "Kind nao esta funcionando."
          }

          Write-Host "Validando Kubernetes..."
          $context = kubectl config current-context
          if ($LASTEXITCODE -ne 0 -or $context -ne "kind-oficina-local") {
            throw "Contexto Kubernetes incorreto: $context"
          }

          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
            throw "Nao foi possivel acessar os nos Kubernetes."
          }

      - name: Baixar imagem publicada
        shell: powershell
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $repo = "${{ github.event.repository.name }}".ToLower()

          if ($repo.StartsWith("-")) {
            $repo = $repo.Substring(1)
          }

          $sha = "${{ github.sha }}"
          $image = "ghcr.io/{0}/{1}:{2}" -f $owner, $repo, $sha

          Write-Host "Owner: $owner"
          Write-Host "Repository: $repo"
          Write-Host "Imagem: $image"

          $downloadOk = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Tentativa $attempt de 3..."

            docker pull $image

            if ($LASTEXITCODE -eq 0) {
              $downloadOk = $true
              break
            }

            if ($attempt -lt 3) {
              Write-Host "Download interrompido. Aguardando 15 segundos..."
              Start-Sleep -Seconds 15
            }
          }

          if (-not $downloadOk) {
            throw "Falha ao baixar imagem do GHCR apos 3 tentativas."
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "IMAGE_NAME=$image`n",
            $utf8NoBom
          )

      - name: Carregar imagem no Kind
        shell: powershell
        run: |
          kind load docker-image $env:IMAGE_NAME --name oficina-local
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao carregar imagem no Kind."
          }

      - name: Aplicar configurações Kubernetes
        shell: powershell
        run: |
          kubectl apply -f k8s/namespace.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar namespace."
          }

          kubectl get secret oficina-secret -n oficina
          if ($LASTEXITCODE -ne 0) {
            throw "Secret oficina-secret nao encontrado."
          }

          kubectl apply -f k8s/postgres.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar PostgreSQL."
          }

          kubectl rollout status statefulset/postgres -n oficina --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL nao ficou pronto."
          }

          kubectl apply -f k8s/configmap.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar ConfigMap."
          }

          kubectl apply -f k8s/deployment.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar Deployment."
          }

          kubectl apply -f k8s/hpa.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao aplicar HPA."
          }

      - name: Atualizar aplicação
        shell: powershell
        run: |
          kubectl set image deployment/oficina-api api=$env:IMAGE_NAME -n oficina
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao atualizar imagem da API."
          }

          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Deploy da API nao foi concluido."
          }

      - name: Validar deploy
        shell: powershell
        run: |
          Write-Host "Pods:"
          kubectl get pods -n oficina -o wide

          Write-Host "Services:"
          kubectl get services -n oficina

          Write-Host "HPA:"
          kubectl get hpa -n oficina

          Write-Host "Health check:"
          $response = Invoke-RestMethod http://localhost:8080/health
          $response | ConvertTo-Json
